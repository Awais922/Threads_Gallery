<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Threads Gallery</title>
    <link rel="icon" type="image/png" href="head.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_configuration.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#F4F7F6] text-[#1E293B] min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white/90 backdrop-blur-xl border border-teal-100/60 rounded-3xl shadow-xl shadow-teal-900/5 p-8 sm:p-10 transition-all duration-300">
        
        <!-- Brand Header with logo.png -->
        <div class="text-center mb-8">
            <img src="logo.png" alt="Threads Gallery Logo" class="mx-auto h-24 w-24 object-cover rounded-full mb-3">
            <h1 class="text-2xl font-bold tracking-tight text-teal-950">Threads Gallery</h1>
            <p class="text-sm text-slate-500 mt-1">Sign in to your account to continue shopping</p>
        </div>

        <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
            
            <!-- Error / Success Alert Box -->
            <div id="form-message" class="hidden p-3 rounded-xl text-sm font-medium transition-all"></div>

            <!-- Email Field -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="mail" class="w-5 h-5"></i>
                    </span>
                    <input type="email" id="email" required placeholder="name@example.com" 
                        class="w-full pl-11 pr-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 transition">
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-600">Password</label>
                    <a href="#" class="text-xs font-medium text-teal-700 hover:underline">Forgot password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full pl-11 pr-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 transition">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-btn" class="w-full py-3.5 px-4 bg-teal-700 hover:bg-teal-800 text-white font-semibold rounded-xl shadow-lg shadow-teal-700/20 transition-all flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Register Redirect Link pointing to register.html -->
        <p class="text-center text-sm text-slate-500 mt-8">
            Don't have an account? 
            <a href="register.html" class="font-semibold text-teal-700 hover:underline">Register now</a>
        </p>
    </div>

    <script>
        const profileTableName = 'profiles';

        // Initialize Lucide Icons
        lucide.createIcons();

        // Safe Custom Message Drawer
        function showMessage(text, isError = false) {
            const msgBox = document.getElementById('form-message');
            msgBox.textContent = text;
            msgBox.className = `p-3 rounded-xl text-sm font-medium transition-all ${isError ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'}`;
            msgBox.classList.remove('hidden');
        }

        async function resolveUserRole(user) {
            const { data, error } = await window.supabaseClient
                .from(profileTableName)
                .select('role')
                .eq('id', user.id)
                .maybeSingle();

            if (error) {
                console.warn('Role lookup failed:', error.message);
                return null;
            }

            return data?.role ? String(data.role).toLowerCase() : null;
        }

        function redirectByRole(role) {
            if (role === 'admin') {
                showMessage('Admin access confirmed. Redirecting to dashboard...');
                setTimeout(() => { window.location.href = 'admin.html'; }, 1200);
                return;
            }

            if (role === 'customer') {
                showMessage('Login successful! Redirecting to storefront...');
                setTimeout(() => { window.location.href = 'home.html'; }, 1200);
                return;
            }

            showMessage('Your account does not have a valid role. Please contact support.', true);
        }

        // Login Handler integrated with Supabase
        async function handleLogin(e) {
            e.preventDefault();

            if (!window.supabaseClient) {
                showMessage('Supabase is not initialized. Check the configuration file.', true);
                return;
            }
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                const message = (error.message || '').toLowerCase();

                if (message.includes('email not confirmed')) {
                    showMessage('This account exists but is not confirmed yet. Check the email inbox for the confirmation link.', true);
                } else if (message.includes('invalid login credentials')) {
                    showMessage('Wrong email or password. If this is the admin account, confirm it in Supabase Auth and verify the password.', true);
                } else {
                    showMessage(error.message || 'Login failed. Please try again.', true);
                }
            } else {
                const role = await resolveUserRole(data.user);

                if (!role) {
                    showMessage('Role could not be verified. Please contact support.', true);
                    await window.supabaseClient.auth.signOut();
                    return;
                }

                redirectByRole(role);
            }
        }

        console.log("Threads Gallery Login Page Initialized");
    </script>
</body>
</html>

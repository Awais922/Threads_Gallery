<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads Gallery | Orders</title>
    <link rel="icon" type="image/png" href="head.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_configuration.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-[linear-gradient(135deg,_#f8fafc_0%,_#eefaf8_55%,_#e7f6f4_100%)] text-slate-800 flex items-center justify-center p-4">
    <div class="w-full max-w-3xl rounded-[2rem] border border-teal-100/70 bg-white/85 backdrop-blur-xl shadow-[0_20px_70px_rgba(13,148,136,0.08)] p-6 sm:p-8 lg:p-10">
        <div class="flex items-center justify-between gap-4 mb-8">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Threads Gallery Logo" class="h-12 w-12 object-cover rounded-full ring-2 ring-teal-100">
                <div>
                    <div class="text-base font-bold text-teal-950">Threads Gallery</div>
                    <div class="text-xs uppercase tracking-[0.24em] text-teal-700/80">Admin Portal</div>
                </div>
            </div>
            <a href="admin.html" class="inline-flex items-center gap-2 rounded-xl border border-slate-200 px-4 py-2.5 font-semibold text-slate-700 hover:bg-slate-50 transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Back
            </a>
        </div>

        <div class="rounded-3xl border border-dashed border-teal-200 bg-teal-50/50 p-8 sm:p-10 text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-teal-700 text-white mb-5">
                <i data-lucide="clipboard-list" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-teal-950">Order Management</h1>
            <p class="mt-3 text-slate-600 max-w-xl mx-auto">
                Orders workspace will live here. Use this page to review new purchases, update fulfillment, and track customer requests.
            </p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads Gallery | Create Account</title>
    <link rel="icon" type="image/png" href="head.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_configuration.js"></script>
    <script src="auth_guard.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-teal-50 via-slate-50 to-teal-100/50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white/90 backdrop-blur-xl border border-teal-100/60 rounded-3xl shadow-xl shadow-teal-900/5 p-8 sm:p-10 transition-all duration-300">
        
        <!-- Brand Header with logo.png -->
        <div class="text-center mb-6">
            <img src="logo.png" alt="Threads Gallery Logo" class="mx-auto h-24 w-24 object-cover rounded-full mb-3">
            <h1 class="text-2xl font-bold tracking-tight text-teal-950">Create Account</h1>
            <p class="text-sm text-slate-500 mt-1">Join Threads Gallery for exclusive unstitched collections</p>
        </div>

        <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
            
            <!-- Error / Success Alert Box -->
            <div id="form-message" class="hidden p-3 rounded-xl text-sm font-medium transition-all"></div>

            <!-- Full Name Field -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Full Name</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </span>
                    <input type="text" id="fullname" required placeholder="Ayesha Khan" 
                        class="w-full pl-11 pr-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 transition">
                </div>
            </div>

            <!-- Email Field -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="mail" class="w-5 h-5"></i>
                    </span>
                    <input type="email" id="email" required placeholder="name@example.com" 
                        class="w-full pl-11 pr-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 transition">
                </div>
            </div>

            <!-- Two Column Grid for Phone & Country -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Phone Number</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="phone" class="w-5 h-5"></i>
                        </span>
                        <input type="tel" id="phone" required placeholder="+92 300 1234567" 
                            class="w-full pl-11 pr-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Country</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="globe" class="w-5 h-5"></i>
                        </span>
                        <input type="text" id="country" required placeholder="Pakistan" 
                            class="w-full pl-11 pr-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 transition">
                    </div>
                </div>
            </div>

            <!-- Date of Birth Field -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Date of Birth</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="calendar" class="w-5 h-5"></i>
                    </span>
                    <input type="date" id="dob" required 
                        class="w-full pl-11 pr-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 transition">
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" minlength="6"
                        class="w-full pl-11 pr-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 transition">
                </div>
                <p class="text-xs text-slate-400 mt-1">Must be at least 6 characters long.</p>
            </div>

            <!-- Submit Button pointing to index.html on success -->
            <button type="submit" id="submit-btn" class="w-full py-3 px-4 bg-teal-700 hover:bg-teal-800 text-white font-semibold rounded-xl shadow-lg shadow-teal-700/20 transition-all flex items-center justify-center gap-2 mt-2">
                <span>Create Account</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Already have an account? 
            <a href="index.html" class="font-semibold text-teal-700 hover:underline">Sign in</a>
        </p>
    </div>

    <script>
        const profileTableName = 'profiles';

        lucide.createIcons();

        (async function init() {
            await ThreadsGalleryAuth.redirectAuthenticatedUser({ customerUrl: 'home.html', adminUrl: 'admin.html' });
        })();

        function showMessage(text, isError = false) {
            const msgBox = document.getElementById('form-message');
            msgBox.textContent = text;
            msgBox.className = `p-3 rounded-xl text-sm font-medium transition-all ${isError ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-teal-50 text-teal-700 border border-teal-200'}`;
            msgBox.classList.remove('hidden');
        }

        function setSubmitState(isLoading) {
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = isLoading;
            submitBtn.classList.toggle('opacity-70', isLoading);
            submitBtn.classList.toggle('cursor-not-allowed', isLoading);
            submitBtn.querySelector('span').textContent = isLoading ? 'Creating Account...' : 'Create Account';
        }

        async function handleRegister(e) {
            e.preventDefault();
            if (!window.supabaseClient) {
                showMessage('Supabase is not initialized. Check the configuration file.', true);
                return;
            }

            if (document.getElementById('submit-btn').disabled) {
                return;
            }

            const fullName = document.getElementById('fullname').value;
            const password = document.getElementById('password').value;

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long.', true);
                return;
            }

            const email = document.getElementById('email').value.trim().toLowerCase();
            const phoneNumber = document.getElementById('phone').value.trim();
            const country = document.getElementById('country').value.trim();
            const dob = document.getElementById('dob').value;

            setSubmitState(true);

            try {
                const { data, error } = await window.supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            phone_number: phoneNumber,
                            country: country,
                            dob: dob,
                            role: 'customer'
                        }
                    }
                });

                if (error) {
                    const message = (error.message || '').toLowerCase();
                    const alreadyExists = message.includes('already registered') || message.includes('user already registered');
                    const rateLimited = error.status === 429 || message.includes('too many requests');

                    if (alreadyExists) {
                        showMessage('This email is already registered. Use a different email.', true);
                    } else if (rateLimited) {
                        showMessage('Too many signup attempts. Please wait a minute and try again, or use a different email.', true);
                    } else {
                        showMessage(error.message, true);
                    }

                    return;
                }

                showMessage(`Account created for ${fullName}. Check your email to confirm the account, then sign in.`);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } finally {
                setSubmitState(false);
            }
        }
        console.log("Threads Gallery Register Page Initialized");
    </script>
</body>
</html>
